<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
  <title>星觅海的博客</title>
  <meta name="description" content="星觅海的个人博客，分享技术文章和生活随笔">
  <meta name="author" content="星觅海">
  <meta name="theme-color" content="#0061a4">

  <!-- SEO / Open Graph -->
  <meta property="og:title" content="星觅海的博客">
  <meta property="og:description" content="星觅海的个人博客，分享技术文章和生活随笔">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.xmhai.cn">
  <meta property="og:image" content="https://q1.qlogo.cn/g?b=qq&nk=1498934815&s=640">
  <meta name="twitter:card" content="summary">

  <!-- 资源预连接 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="https://q1.qlogo.cn/g?b=qq&nk=1498934815&s=100">
  <link rel="search" type="application/opensearchdescription+xml" href="/opensearch.xml" title="星觅海的博客">

  <!-- 字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">

  <!-- MDUI -->
  <link rel="stylesheet" href="https://unpkg.com/mdui/mdui.css">
  <script src="https://unpkg.com/mdui/mdui.global.js" defer></script>

  <!-- 代码高亮（关键样式） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">

  <!-- 非关键样式：延迟加载 -->
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.css"></noscript>

  <link rel="stylesheet" href="https://unpkg.com/@waline/client@3.3.0/dist/waline.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const html = document.documentElement;
      html.classList.remove('mdui-theme-light', 'mdui-theme-dark', 'mdui-theme-auto');
      if (saved === 'dark') html.classList.add('mdui-theme-dark');
      else if (saved === 'light') html.classList.add('mdui-theme-light');
      else html.classList.add('mdui-theme-auto');
    })();
  </script>

  <!-- 关键脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>

  <!-- 非关键脚本：defer -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" defer></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- 阅读进度条 -->
  <div class="reading-progress" id="reading-progress">
    <div class="reading-progress-bar" id="reading-progress-bar"></div>
  </div>

  <!-- 回到顶部 -->
  <mdui-fab class="back-to-top" id="back-to-top" icon="arrow_upward" style="display:none;" title="回到顶部"></mdui-fab>

  <mdui-top-app-bar class="top-app-bar">
    <mdui-button-icon id="menu-btn" aria-label="打开菜单">
      <mdui-icon name="menu"></mdui-icon>
    </mdui-button-icon>
    <mdui-top-app-bar-title>星觅海的博客</mdui-top-app-bar-title>
    <mdui-button-icon id="toc-toggle-btn" title="目录" style="display:none;" aria-label="文章目录">
      <mdui-icon name="toc"></mdui-icon>
    </mdui-button-icon>
  </mdui-top-app-bar>

  <mdui-card class="sidebar" id="sidebar" variant="elevated">
    <div class="sidebar-inner">
      <div class="site-brand">
        <mdui-avatar src="https://q1.qlogo.cn/g?b=qq&nk=1498934815&s=100" alt="avatar" class="site-avatar"></mdui-avatar>
        <div class="sidebar-text site-meta">
          <div class="mdui-typescale-title-medium site-name">星觅海</div>
          <div class="mdui-typescale-body-small site-desc">一起慢慢进步</div>
        </div>
      </div>
      <div class="search-wrap sidebar-text">
        <mdui-text-field id="search-input" variant="outlined" placeholder="搜索文章..." icon="search" helper="输入关键词实时搜索，按 / 快速聚焦" class="search-field" aria-label="搜索文章"></mdui-text-field>
        <div class="search-dropdown" id="search-dropdown">
          <div id="search-results"></div>
        </div>
      </div>
      <mdui-divider class="nav-divider"></mdui-divider>
      <mdui-list class="nav-list">
        <mdui-list-item rounded href="#/" id="nav-home">
          <mdui-icon name="home" slot="icon"></mdui-icon>
          <div class="sidebar-text">首页</div>
        </mdui-list-item>
        <mdui-list-item rounded href="#/friends" id="nav-friends">
          <mdui-icon name="group" slot="icon"></mdui-icon>
          <div class="sidebar-text">朋友</div>
        </mdui-list-item>
        <mdui-list-item rounded href="#/archive" id="nav-archive">
          <mdui-icon name="archive" slot="icon"></mdui-icon>
          <div class="sidebar-text">归档</div>
        </mdui-list-item>
        <mdui-list-item rounded href="#/about" id="nav-about">
          <mdui-icon name="person" slot="icon"></mdui-icon>
          <div class="sidebar-text">关于</div>
        </mdui-list-item>
      </mdui-list>
      <mdui-divider class="nav-divider"></mdui-divider>
      <div class="theme-wrap">
        <mdui-button-icon id="theme-light" title="亮色模式" aria-label="亮色模式">
          <mdui-icon name="brightness_7"></mdui-icon>
        </mdui-button-icon>
        <mdui-button-icon id="theme-dark" title="暗色模式" aria-label="暗色模式">
          <mdui-icon name="brightness_2"></mdui-icon>
        </mdui-button-icon>
        <mdui-button-icon id="theme-auto" title="跟随系统" aria-label="跟随系统">
          <mdui-icon name="brightness_auto"></mdui-icon>
        </mdui-button-icon>
      </div>
    </div>
  </mdui-card>

  <!-- 文章目录侧边栏 -->
  <mdui-card class="toc-sidebar" id="toc-sidebar" variant="elevated">
    <div class="toc-header">
      <span class="mdui-typescale-title-small">目录</span>
      <mdui-button-icon id="toc-close-btn" aria-label="关闭目录">
        <mdui-icon name="close"></mdui-icon>
      </mdui-button-icon>
    </div>
    <mdui-divider></mdui-divider>
    <div class="toc-content" id="toc-content"></div>
  </mdui-card>

  <div class="main-content" id="main-content">
    <div class="app-bar-spacer"></div>
    <div id="page-container" class="page-transition"></div>
    <footer class="footer">
      <div class="footer-rss">
        <a href="/rss.xml" class="footer-link">
          <mdui-icon name="rss_feed"></mdui-icon>
          <span>RSS 订阅</span>
        </a>
      </div>
      <div class="mdui-typescale-body-small footer-copy">
        © <span id="year"></span> 星觅海 · Powered by MDUI
      </div>
      <div class="pageviews">
        <span id="pageviews-total">加载中...</span> · 
        <span id="pageviews-today">今日 0</span>
      </div>
      <div class="site-uptime">
        <span id="site-uptime">加载中...</span>
      </div>
      <div class="icp">
      <a href="https://icp.gov.moe/?keyword=20259910" target="_blank" rel="noopener noreferrer"><img alt="icp" src="/assets/images/icp.svg" /></a>
      </div>
      <div class="other">
      <a href="https://www.blogsclub.org/certificate/10000218" target="_blank"><img src="https://www.blogsclub.org/images/blue-cert.png" style="width:117px;height:41px;"></a>
      <a href="https://www.blogsclub.org/rank.html" target="_blank">
        <img src="https://www.blogsclub.org/badge/www.xmhai.cn" style="height:60px!important" loading="lazy"></a>
      </div>
    </footer>
  </div>

  <script type="module">
    import { init } from 'https://unpkg.com/@waline/client/dist/waline.js';
    window.WalineInit = init;
  </script>
  <script src="/assets/js/main.js" type="module"></script>
</body>
</html>
