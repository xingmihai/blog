# Cloudflare Pages 部署配置
#
# 仓库已无 Cloudflare Pages Functions：
#   - 访问量统计走 Waline 计数接口
#   - 友链 RSS 由 GitHub Actions 定时抓取，生成静态 friends-rss.json
# 因此不需要任何 D1 / KV 绑定，本文件只保留构建相关配置。

name = "xmh-mdui-blog"
compatibility_date = "2024-09-01"

# Pages 项目请在控制台设置：构建命令 = node build.js，输出目录 = .
# 注意：加了 pages_build_output_dir 后，本文件即成为项目配置的 source of truth，
# 部署后 Cloudflare 控制台里这些字段只能查看、不能编辑。
pages_build_output_dir = "."
