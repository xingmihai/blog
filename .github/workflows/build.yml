name: Build Blog

on:
  push:
    branches: [main, master]
    paths:
      - 'posts/**'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: node build.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blog-build
          path: |
            posts-html/
            search.json
            rss.xml
            sitemap.xml
